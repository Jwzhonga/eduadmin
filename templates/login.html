<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教务管理系统 - 登录</title>
    <link href="/static/bootstrap.min.css?v=2" rel="stylesheet">
    <link href="/static/fontawesome.min.css?v=2" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <style>
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body {
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }
        .login-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
        }
        .login-card .card-body { padding: 2.5rem; }
        .login-card h4 {
            color: #1d1d1f;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.02em;
        }
        .login-card .form-control {
            border-radius: 8px;
            padding: 12px 16px;
            border: 1px solid #d2d2d7;
            font-size: 15px;
            background: rgba(255,255,255,0.9);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .login-card .form-control:focus {
            border-color: #007aff;
            box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
        }
        .login-card .form-control::placeholder { color: #86868b; }
        .login-card .btn-primary {
            background: #007aff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.25,0.1,0.25,1);
        }
        .login-card .btn-primary:hover {
            background: #0066d6;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0,122,255,0.3);
        }
        .login-card .btn-primary:active {
            background: #0055b3;
            transform: scale(0.97);
        }
        .login-icon {
            font-size: 48px;
            color: #007aff;
            margin-bottom: 12px;
        }
        .login-subtitle {
            color: #86868b;
            font-size: 14px;
            margin-bottom: 0;
        }
        .login-link {
            color: #007aff;
            font-weight: 500;
        }
        .login-link:hover {
            color: #0077ed;
            text-decoration: underline !important;
        }
        .login-alert {
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            background: #e8f4fd;
            color: #0066cc;
            border: none;
            margin-bottom: 16px;
        }
        @media (max-width: 576px) {
            .login-card .card-body { padding: 1.5rem; }
            .container { padding: 16px; }
            .login-card h4 { font-size: 18px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-5 col-lg-4">
            <div class="card login-card border-0">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="login-icon"><i class="fas fa-graduation-cap"></i></div>
                        <h4>教务管理系统</h4>
                        <p class="login-subtitle">请登录以继续</p>
                    </div>
                    {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    {% for msg in messages %}
                    <div class="login-alert">{{ msg }}</div>
                    {% endfor %}
                    {% endif %}
                    {% endwith %}
                    <form method="post">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label small fw-medium" style="color:#515154">用户名</label>
                            <input type="text" name="username" class="form-control" required placeholder="请输入用户名">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-medium" style="color:#515154">密码</label>
                            <input type="password" name="password" class="form-control" required placeholder="请输入密码">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登录</button>
                    </form>
                    <div class="text-center mt-4">
                        <small class="text-muted"><a href="/change-password" class="login-link text-decoration-none">修改密码</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
