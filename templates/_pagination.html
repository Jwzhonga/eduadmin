{% if total > 50 %}
<div class="d-flex justify-content-between align-items-center mt-2 no-print">
    <span class="text-muted" style="font-size:12px">共 {{ total }} 条</span>
    <nav><ul class="pagination pagination-sm mb-0">
        <li class="page-item {% if page <= 1 %}disabled{% endif %}">
            <a class="page-link" href="?page={{ [1, page-1]|max }}{% if qs %}&{{ qs }}{% endif %}">«</a>
        </li>
        {% for p in range([1, page-2]|max, [pages, page+2]|min + 1) %}
        <li class="page-item {% if p == page %}active{% endif %}">
            <a class="page-link" href="?page={{ p }}{% if qs %}&{{ qs }}{% endif %}">{{ p }}</a>
        </li>
        {% endfor %}
        <li class="page-item {% if page >= pages %}disabled{% endif %}">
            <a class="page-link" href="?page={{ [pages, page+1]|min }}{% if qs %}&{{ qs }}{% endif %}">»</a>
        </li>
    </ul></nav>
</div>
{% else %}
<div class="text-end text-muted mt-2" style="font-size:12px">共 {{ total }} 条</div>
{% endif %}
