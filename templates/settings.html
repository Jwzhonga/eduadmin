{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="page-title mb-0"><i class="fas fa-cog" style="color:#007aff;margin-right:8px"></i> 系统设置</h5>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" action="/settings/save">
            {% for key, default, remark in defs %}
            <div class="row mb-3 align-items-center">
                <label class="col-md-3 col-form-label text-md-end" style="font-weight:600">{{ remark }}</label>
                <div class="col-md-5">
                    <input type="text" class="form-control form-control-sm" name="{{ key }}" value="{{ vals[key] }}">
                </div>
                <div class="col-md-4 small text-muted">默认值：{{ default }}</div>
            </div>
            {% endfor %}
            <div class="row">
                <div class="col-md-5 offset-md-3">
                    <button class="btn btn-primary btn-sm"><i class="fas fa-save"></i> 保存设置</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
